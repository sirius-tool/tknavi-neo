<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たちこくナビneo</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceaff;--fg:#17133a;--mut:#615c8f;--card:rgba(255,255,255,.72);--bd:rgba(90,70,220,.18);--a:#5b3df5;--b:#ff4f9a;--c:#00b8c4;--ok:#0f9d63;--ng:#e23d4b;--orb:.55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b24;--fg:#efedff;--mut:#9b96c9;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--ok:#3ddc97;--ng:#ff6b78;--orb:.35}}
:root[data-theme="dark"]{--bg:#0d0b24;--fg:#efedff;--mut:#9b96c9;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--ok:#3ddc97;--ng:#ff6b78;--orb:.35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:500;overflow-x:hidden}
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--orb);animation:fl 14s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:46vmax;height:46vmax;background:var(--a);left:-14vmax;top:-12vmax}
.orbs i:nth-child(2){width:38vmax;height:38vmax;background:var(--b);right:-12vmax;top:18vh;animation-delay:-5s}
.orbs i:nth-child(3){width:34vmax;height:34vmax;background:var(--c);left:20vw;bottom:-18vmax;animation-delay:-9s}
@keyframes fl{to{transform:translate(4vmax,3vmax) scale(1.12)}}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mark{font-weight:900;font-size:15px;letter-spacing:.04em}
.mark b{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;padding:2px 9px;border-radius:99px;margin-left:6px;font-size:12px}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:99px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;backdrop-filter:blur(10px)}
.ib:focus-visible,.btn:focus-visible,input:focus-visible,.cat:focus-visible{outline:3px solid var(--c);outline-offset:2px}
h1{font-family:"Dela Gothic One","Zen Maru Gothic",sans-serif;font-weight:400;font-size:clamp(46px,13vw,124px);line-height:1;margin:42px 0 6px;letter-spacing:-.02em}
h1 span{display:block;background:linear-gradient(100deg,var(--a) 10%,var(--b) 55%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 8s linear infinite alternate}
h1 em{font-style:normal;display:inline-block;font-size:.42em;transform:rotate(-6deg);border:3px solid currentColor;border-radius:14px;padding:0 .3em;margin-left:.2em;-webkit-text-fill-color:var(--fg);color:var(--fg)}
@keyframes hue{to{filter:hue-rotate(40deg)}}
.lead{color:var(--mut);max-width:34em;line-height:1.8;margin:14px 0 30px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cat{--k:var(--a);text-align:left;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(14px);color:var(--fg);font:inherit;border-radius:26px;padding:20px;cursor:pointer;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.cat::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--k);opacity:.22}
.cat:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 14px 34px -14px var(--k)}
.cat .ic{font-size:34px}.cat h3{margin:8px 0 4px;font-size:19px}.cat p{margin:0;color:var(--mut);font-size:13px;line-height:1.6}
.cat .meta{display:flex;justify-content:space-between;margin-top:16px;font-size:12px;font-weight:700;color:var(--k)}
.cat.wide{grid-column:1/-1;background:linear-gradient(120deg,var(--a),var(--b));color:#fff;border:0}.cat.wide p,.cat.wide .meta{color:#ffffffd0}
.cat.wide::before{background:#fff}
.hd{display:flex;align-items:center;gap:12px;margin:8px 0 22px}
.bar{flex:1;height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));border-radius:9px;transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.qc{border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(16px);border-radius:32px;padding:clamp(20px,4vw,38px);animation:pop .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}}
.tag{display:inline-block;background:var(--k,var(--a));color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:3px 12px}
.q{font-size:clamp(20px,3.6vw,28px);line-height:1.6;font-weight:900;margin:16px 0}
.fig{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:10px;margin:8px 0 14px;max-width:430px}.fig svg{width:100%;height:auto;display:block}
.dot{fill:var(--b)}.dt{fill:#fff;font-weight:900;font-size:12px;font-family:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:200px;border:2px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:18px;padding:15px 18px;font:inherit;font-size:18px;font-weight:700}
.btn{border:0;border-radius:18px;padding:15px 26px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;color:#fff;background:linear-gradient(100deg,var(--a),var(--b));box-shadow:0 10px 24px -12px var(--a)}
.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--bd);box-shadow:none}
.fb{margin-top:18px;border-radius:20px;padding:16px 18px;font-weight:700;line-height:1.7;animation:pop .3s}
.fb.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);border:2px solid var(--ok)}.fb.ng{background:color-mix(in srgb,var(--ng) 16%,transparent);border:2px solid var(--ng)}
.fb big{font-size:22px;display:block}
.res{text-align:center}.ring{width:200px;height:200px;margin:10px auto;position:relative}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:54px}
.rv{text-align:left;margin:20px 0;display:grid;gap:8px}.rv div{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.6}.rv span{color:var(--ng);font-weight:900}
.ft{margin-top:40px;color:var(--mut);font-size:12px;text-align:center}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 20px;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(18px);border-radius:26px;position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;box-shadow:0 12px 30px -20px var(--a)}
.logo{font-weight:900;font-size:21px;cursor:pointer;letter-spacing:.02em}.logo em{font-style:italic;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:3px}.logo b{font-size:11px;margin-left:6px;background:var(--fg);color:var(--bg);border-radius:99px;padding:2px 8px;vertical-align:middle}
.pc{margin-left:auto;font-weight:900;font-size:12px;color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent);border-radius:99px;padding:6px 12px;white-space:nowrap}
.hdr .ib{padding:8px 11px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:20px 0 16px;padding-bottom:4px}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-weight:900;border-radius:99px;padding:10px 20px;cursor:pointer;white-space:nowrap;transition:transform .2s}.tab:hover{transform:translateY(-2px)}.tab.on{background:linear-gradient(100deg,var(--a),var(--b));color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px var(--a)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.st{border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(14px);border-radius:22px;padding:16px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--mut)}.st b{display:block;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(28px,7vw,42px);line-height:1.2;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sr{display:flex;align-items:center;gap:12px;margin:14px 0;font-weight:700;font-size:14px}.sr>span{flex:0 0 9.5em}
.cat::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%) -150% 0/250% 100% no-repeat;transition:background-position .7s}.cat:hover::after{background-position:150% 0}
.cat .ic{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,var(--k) 18%,transparent);font-size:30px}
@media (max-width:520px){.sr>span{flex-basis:7em}.pc{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
